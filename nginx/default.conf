log_format structured escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
server {
 listen 8080;
 server_name _;
 server_tokens off;
 access_log /logs/access.log structured;
 error_log /logs/error.log warn;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
 client_max_body_size 1m;
 location /static/ { alias /static/; }
 location = /metrics { return 404; }
 location / {
  proxy_pass http://web:8000;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
}
server {
 listen 8081;
 location = /stub_status { stub_status; access_log off; }
 location / { return 404; }
}
