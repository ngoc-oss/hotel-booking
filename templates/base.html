<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lotus Stay · Đặt phòng khách sạn</title><style>
body{margin:0;background:#f6f5f0;color:#203931;font:16px system-ui}nav{background:#173c34;color:white;padding:22px 7%;display:flex;gap:24px;align-items:center;flex-wrap:wrap}a{color:inherit;text-decoration:none}nav strong{font-size:24px;margin-right:auto}main{max-width:1120px;margin:40px auto;padding:0 24px}h1{font-size:44px;letter-spacing:-1px}h2{font-size:24px}p{line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}.card{background:white;padding:28px;border-radius:16px;border:1px solid #dce3dd}.room-art{background:linear-gradient(135deg,#cdded0,#eddbc1);height:100px;border-radius:10px;padding:18px;font-size:42px;color:#456757}button,.btn{background:#215846;color:white;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;display:inline-block;font:inherit}input,select{display:block;box-sizing:border-box;padding:12px;width:100%;border:1px solid #b9cbc0;border-radius:7px;margin:8px 0}form.inline{display:inline}form.inline button{padding:6px 12px}small,.muted{color:#637a70}.errorlist{color:#a52b30}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:15px;border-bottom:1px solid #dce3dd}.scroll{overflow:auto}footer{padding:30px;text-align:center;color:#637a70}.search{display:flex;gap:15px;align-items:end;flex-wrap:wrap;margin:26px 0}.search label{flex:1}ul{line-height:1.8}</style></head><body><nav><strong><a href="/">LOTUS STAY</a></strong><a href="/">Phòng nghỉ</a>{% if user.is_authenticated %}<a href="/bookings/">Đặt chỗ của tôi</a>{% if user.is_staff %}<a href="/admin/">Quản trị</a>{% endif %}<form class="inline" action="/accounts/logout/" method="post">{% csrf_token %}<button>Đăng xuất</button></form>{% else %}<a href="/accounts/login/">Đăng nhập</a><a href="/signup/">Đăng ký</a>{% endif %}</nav><main>{% for message in messages %}<p>{{message}}</p>{% endfor %}{% block content %}{% endblock %}</main><footer>LOTUS STAY · Đồ án hệ thống đặt phòng khách sạn</footer></body></html>
