name: hotel-booking
services:
  db:
    restart: unless-stopped
    security_opt: &id001
    - no-new-privileges:true
    logging: &id002
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.py}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD}
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./db/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks:
    - data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d hotel
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    restart: 'no'
    security_opt: *id001
    logging: *id002
    build: .
    command:
    - sh
    - -c
    - python manage.py migrate --noinput && python manage.py seed && python manage.py
      collectstatic --noinput
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB_USER: hotel_owner
      DB_PASSWORD: ${OWNER_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
    - static:/app/staticfiles
    networks:
    - data
    depends_on:
      db:
        condition: service_healthy
    cap_drop:
    - ALL
  web:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:?Run setup.py}
      DB_USER: hotel_app
      DB_PASSWORD: ${APP_PASSWORD}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      APP_LOG: /logs/app.log
    read_only: true
    tmpfs:
    - /tmp
    volumes:
    - applogs:/logs
    networks:
    - edge
    - data
    - observe
    depends_on:
      migrate:
        condition: service_completed_successfully
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen("http://localhost:8000/health/")
      interval: 15s
      timeout: 5s
      retries: 5
  nginx:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    build: ./nginx
    ports:
    - 8080:8080
    volumes:
    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    - static:/static:ro
    - nginxlogs:/logs
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    networks:
    - edge
    - observe
    depends_on:
      web:
        condition: service_healthy
  pgadmin:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    image: dpage/pgadmin4:9.8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
    - 127.0.0.1:5050:80
    volumes:
    - pgadmin:/var/lib/pgadmin
    - ./db/servers.json:/pgadmin4/servers.json:ro
    networks:
    - data
    - admin
    depends_on:
      db:
        condition: service_healthy
  prometheus:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    image: prom/prometheus:v3.5.0
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    - promdata:/prometheus
    networks:
    - observe
    cap_drop:
    - ALL
  grafana:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
    - 127.0.0.1:3000:3000
    volumes:
    - grafana:/var/lib/grafana
    - ./monitoring/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    networks:
    - observe
    cap_drop:
    - ALL
  nginx-exporter:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    image: nginx/nginx-prometheus-exporter:1.5.1
    command:
    - --nginx.scrape-uri=http://nginx:8081/stub_status
    networks:
    - observe
    cap_drop:
    - ALL
  postgres-exporter:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://hotel_monitor:${MONITOR_PASSWORD}@db:5432/hotel?sslmode=disable
    networks:
    - data
    - observe
    cap_drop:
    - ALL
  cadvisor:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    - /dev/disk:/dev/disk:ro
    privileged: true
    devices:
    - /dev/kmsg:/dev/kmsg
    networks:
    - observe
networks:
  edge: {}
  data:
    internal: true
  observe:
    internal: true
  admin: {}
volumes:
  pgdata: {}
  static: {}
  applogs: {}
  nginxlogs: {}
  pgadmin: {}
  promdata: {}
  grafana: {}
  lokidata: {}
