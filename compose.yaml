name: hotel-booking
services:
  db:
    restart: unless-stopped
    security_opt: &id001
    - no-new-privileges:true
    logging: &id002
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.py}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD}
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./db/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks:
    - data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d hotel
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    restart: 'no'
    security_opt: *id001
    logging: *id002
    build: .
    command:
    - sh
    - -c
    - python manage.py migrate --noinput && python manage.py seed && python manage.py
      collectstatic --noinput
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB_USER: hotel_owner
      DB_PASSWORD: ${OWNER_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
    - static:/app/staticfiles
    networks:
    - data
    depends_on:
      db:
        condition: service_healthy
    cap_drop:
    - ALL
  web:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:?Run setup.py}
      DB_USER: hotel_app
      DB_PASSWORD: ${APP_PASSWORD}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      APP_LOG: /logs/app.log
    read_only: true
    tmpfs:
    - /tmp
    volumes:
    - applogs:/logs
    networks:
    - edge
    - data
    - observe
    depends_on:
      migrate:
        condition: service_completed_successfully
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen("http://localhost:8000/health/")
      interval: 15s
      timeout: 5s
      retries: 5
  nginx:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    build: ./nginx
    ports:
    - 8080:8080
    volumes:
    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    - static:/static:ro
    - nginxlogs:/logs
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    networks:
    - edge
    - observe
    depends_on:
      web:
        condition: service_healthy
  pgadmin:
    restart: unless-stopped
    security_opt: *id001
    logging: *id002
    image: dpage/pgadmin4:9.8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
    - 127.0.0.1:5050:80
    volumes:
    - pgadmin:/var/lib/pgadmin
    - ./db/servers.json:/pgadmin4/servers.json:ro
    networks:
    - data
    - admin
    depends_on:
      db:
        condition: service_healthy
networks:
  edge: {}
  data:
    internal: true
  observe:
    internal: true
  admin: {}
volumes:
  pgdata: {}
  static: {}
  applogs: {}
  nginxlogs: {}
  pgadmin: {}
  promdata: {}
  grafana: {}
  lokidata: {}
